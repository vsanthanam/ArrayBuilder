name: ArrayBuilder CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - "main"
      - "*release*"
  pull_request:
    branches:
      - "main"
      - "*release*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftformat:
    name: Run SwiftFormat
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Lint with SwiftFormat
        run: ./.scripts/lint-swiftformat

  lint-docc:
    name: Validate Documentation
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Validate Documentation
        run: ./.scripts/lint-docc

  build-macos-spm:
    name: Build ArrayBuilder (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 26.6
      - name: Build ArrayBuilder
        run: swift build -v --build-tests --build-path .build
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: build.zip

  test-macos-spm:
    name: Test ArrayBuilder (macOS)
    needs: build-macos-spm
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 26.6
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: .
      - name: Decompress Build
        run: unzip build.zip
      - name: Test ArrayBuilder
        run: swift test --skip-build

  build-ubuntu-spm:
    name: Build ArrayBuilder (Ubuntu)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build ArrayBuilder
        run: swift build -v --build-tests --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-build
          path: build.zip

  test-ubuntu-spm:
    name: Test ArrayBuilder (Ubuntu)
    needs: build-ubuntu-spm
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-build
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test ArrayBuilder
        run: swift test --skip-build

  build-windows-spm:
    name: Build ArrayBuilder (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Build ArrayBuilder
        run: swift build -v --build-tests --disable-xctest --build-path .build -c debug -Xlinker /INCREMENTAL:NO
      - name: Compress Build
        shell: pwsh
        run: |
          Compress-Archive -Path ".build" -DestinationPath "build.zip" -Force
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: build.zip

  test-windows-spm:
    name: Test ArrayBuilder (Windows)
    needs: build-windows-spm
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: .
      - name: Decompress Build
        shell: pwsh
        run: |
          Expand-Archive -Path "build.zip" -DestinationPath "." -Force
      - name: Test ArrayBuilder
        run: swift test --disable-xctest --skip-build

  build-wasm-spm:
    name: Build ArrayBuilder (WebAssembly)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift WASM
        run: |
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          swift sdk list
      - name: Build ArrayBuilder
        run: swift build -v --swift-sdk swift-6.3.3-RELEASE_wasm --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: build.zip

  build-android-spm:
    name: Build ArrayBuilder (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build ArrayBuilder
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.3"
          build-package: true
          build-tests: false
          run-tests: false
      - name: Install `zip`
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: build.zip

  validate-pr:
    name: Validate Pull Request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-macos-spm
      - test-macos-spm
      - build-ubuntu-spm
      - test-ubuntu-spm
      - build-windows-spm
      - test-windows-spm
      - build-wasm-spm
      - build-android-spm
      - swiftformat
      - lint-docc
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        run: |
          if [[ "${{ needs.build-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-windows-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-windows-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-wasm-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-android-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.swiftformat.result }}" == "failure" ]] || \
            [[ "${{ needs.lint-docc.result }}" == "failure" ]]; then
            echo "❌ Required job failed."
            exit 1
          else
            echo "✅ All required jobs completed successfully."
          fi
